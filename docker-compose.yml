# QA Intelligence Engine — core stack (qa-agent + DB + review UI).
#
# The Jira/Xray MCP server is NOT built or run here — it is an external service assumed to be
# already deployed and functional. Point XRAY_MCP_URL at it and, if its tool names differ from
# the defaults, set XRAY_MCP_TOOL_MAP. See docs/MCP_SERVERS.md.

services:

  # ── Databases ──────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      # Set in .env — required for a secure deployment (see .env.example)
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # Only exposed on loopback — use qa-net for inter-service communication
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - qa-net

  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-qa}
      - POSTGRES_USER=${POSTGRES_USER:-qa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa} -d ${POSTGRES_DB:-qa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-net

  # ── QA Intelligence Engine ─────────────────────────────────────────────────
  qa-agent:
    build:
      context: .
      dockerfile: qa-agent/Dockerfile
      args:
        - HF_TOKEN=${HF_TOKEN}   # used only at build time to download model; not baked into final layer
    container_name: qa-intelligence-engine
    restart: always
    # bge-m3 (2.5 GB) + cross-encoder + FastAPI workers — 6 GB keeps OOM killer away.
    # Tune down to 4g on machines with <12 GB RAM (reranker will load but may be slow).
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      # Local inference (provider="ollama"). Ollama runs on the HOST, not in Compose —
      # host.docker.internal resolves via extra_hosts above.
      # That resolution is necessary but NOT sufficient: Ollama binds 127.0.0.1 by default,
      # so it refuses the bridge address this name resolves to and every ollama-backed
      # request fails with a connection error. Ollama must also listen beyond loopback —
      # set OLLAMA_HOST on the host service (see README, "Local inference with Ollama").
      # OLLAMA_NUM_CTX is mandatory in practice: Ollama's default window is a few
      # thousand tokens no matter what the model supports, and overflow is dropped silently.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_TIMEOUT_SEC=${OLLAMA_TIMEOUT_SEC:-600}
      - QA_DEFAULT_PROVIDER=${QA_DEFAULT_PROVIDER:-anthropic}
      - QA_DEFAULT_MODEL=${QA_DEFAULT_MODEL:-claude-opus-5}
      - QA_AGENT_MAX_TURNS=${QA_AGENT_MAX_TURNS:-40}
      # Thinking tokens are drawn from this budget — 32K leaves room for adaptive reasoning
      # plus the response. Lower it for local models with a small num_ctx.
      - QA_AGENT_MAX_OUTPUT_TOKENS=${QA_AGENT_MAX_OUTPUT_TOKENS:-32000}
      # Extended thinking + effort on the Anthropic path. QA_ANTHROPIC_THINKING=off disables.
      - QA_ANTHROPIC_THINKING=${QA_ANTHROPIC_THINKING:-adaptive}
      - QA_ANTHROPIC_EFFORT=${QA_ANTHROPIC_EFFORT:-high}
      - QA_PROMPT_CACHING=${QA_PROMPT_CACHING:-1}
      # Model tiering: the fast model (QA_DEFAULT_*) handles high-volume triage; the
      # reasoning model handles cross-document impact and contradiction detection,
      # where a small model produces confident nonsense. BOTH must be set or the
      # reasoning tier stays inactive (and says so at startup).
      - QA_REASONING_PROVIDER=${QA_REASONING_PROVIDER:-}
      - QA_REASONING_MODEL=${QA_REASONING_MODEL:-}
      # Reranker. ms-marco-MiniLM is English-only and scored this corpus's BEST hits
      # at about -11 (it judged everything irrelevant). BAAI/bge-reranker-v2-m3 is
      # multilingual and needs no re-index — but its logit scale differs, so the
      # thresholds below must be recalibrated when you switch.
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - QA_RERANK_HIGH=${QA_RERANK_HIGH:-2.0}
      - QA_RERANK_MEDIUM=${QA_RERANK_MEDIUM:-0.5}
      # Override the model context-window table when it is wrong for your deployment.
      - QA_AGENT_CONTEXT_LIMIT=${QA_AGENT_CONTEXT_LIMIT:-}
      - QA_PRD_READ_BUDGET_RATIO=${QA_PRD_READ_BUDGET_RATIO:-0.4}
      # ── Logging / tracing ──
      # QA_LOG_LEVEL: our modules. QA_LOG_THIRDPARTY silences httpx/elastic_transport,
      # which otherwise emit one INFO line per network call and bury everything else.
      - QA_LOG_LEVEL=${QA_LOG_LEVEL:-INFO}
      - QA_LOG_THIRDPARTY=${QA_LOG_THIRDPARTY:-WARNING}
      - QA_LOG_HTTP=${QA_LOG_HTTP:-0}
      # QA_TRACE=1 appends full request/response/chunk/index payloads as JSONL to
      # QA_TRACE_FILE. Verbose by design — for bring-up, not steady state.
      - QA_TRACE=${QA_TRACE:-0}
      - QA_TRACE_FILE=${QA_TRACE_FILE:-/app/eval/payload-trace.jsonl}
      - QA_TRACE_MAX_CHARS=${QA_TRACE_MAX_CHARS:-20000}
      - QA_TRACE_STDOUT=${QA_TRACE_STDOUT:-0}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-qa}
      - POSTGRES_USER=${POSTGRES_USER:-qa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      # External Jira/Xray MCP server, reached over the shared `mcp-net` network by service
      # name — see ../xray-mcp/docker-compose.yml. Override for a differently-hosted
      # server; use host.docker.internal:3100 if you run it directly on the host instead.
      # XRAY_MCP_TOOL_MAP remaps tool/argument names per deployment.
      - XRAY_MCP_URL=${XRAY_MCP_URL:-http://xray-mcp:3100/mcp}
      - XRAY_MCP_TOOL_MAP=${XRAY_MCP_TOOL_MAP:-}
      - XRAY_MCP_UNWRAP_DATA=${XRAY_MCP_UNWRAP_DATA:-1}
      - MCP_TOOL_TIMEOUT_SEC=${MCP_TOOL_TIMEOUT_SEC:-60}
      # main.py reads this to enable the nightly 20:30 UTC sync, and the review UI
      # pre-fills it as the write-back project. It was set in .env but never forwarded,
      # so nightly sync was silently disabled.
      - XRAY_PROJECT_KEY=${XRAY_PROJECT_KEY:-}
      # The code reads CONFLUENCE_DOMAIN (bare host, no scheme) in confluence_ingestor.py,
      # confluence_space_ingestor.py and writeback.py. Only CONFLUENCE_BASE_URL used to be
      # passed here and nothing reads that, so Confluence ingestion failed with
      # "CONFLUENCE_DOMAIN must be set" and write-back could not build PRD backlinks.
      - CONFLUENCE_DOMAIN=${CONFLUENCE_DOMAIN}
      - CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - JIRA_BASE_URL=https://${JIRA_DOMAIN}
      - JIRA_EMAIL=${CONFLUENCE_EMAIL}
      - JIRA_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - GITLAB_HOST=${GITLAB_HOST:-gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_PROJECT_ID=${GITLAB_PROJECT_ID}
      # writeback.py uses this when building GitLab PRD backlink URLs.
      - GITLAB_DEFAULT_REF=${GITLAB_DEFAULT_REF:-main}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
    volumes:
      - models_cache:/root/.cache/huggingface
      # DEVELOPMENT ONLY — remove this bind-mount before deploying to production.
      # In production the app code is baked into the image; this mount shadows it
      # and means any host file change is live without a rebuild.
      - ./qa-agent:/app
      # Overlay: phase ledger must survive container recreation (listed after /app bind)
      - qa_ledger_data:/app/eval
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      # /health runs a real bge-m3 forward pass, which can exceed 10s while the CPU is
      # contended (e.g. Ollama running a 12B model alongside).
      timeout: 30s
      retries: 5
      # Cold start = load bge-m3 (2.5GB) + the cross-encoder, then connect ES/Postgres.
      # The old 180s + 5x30s = 330s budget expired at 325.8s on this machine and Compose
      # declared the service failed even though it came up healthy moments later — which
      # also blocked streamlit-review, since it waits on service_healthy.
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - qa-net
      # Reaches the MCP servers by service name over the shared `mcp-net` network,
      # which the first stack to start creates automatically.
      - mcp-net

  streamlit-review:
    build:
      context: .
      dockerfile: qa-agent/Dockerfile.streamlit
    container_name: qa-review-ui
    restart: always
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-qa}
      - POSTGRES_USER=${POSTGRES_USER:-qa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - QA_AGENT_URL=http://qa-agent:8000
      - REVIEW_UI_PASSWORD=${REVIEW_UI_PASSWORD:-}
    depends_on:
      qa-agent:
        condition: service_healthy
    networks:
      - qa-net

volumes:
  postgres_data:
  es_data:
  models_cache:
  qa_ledger_data:

networks:
  qa-net:
    driver: bridge
  # Shared with the MCP servers, which declare it external too. External because the
  # network belongs to no single stack — a non-external declaration makes Compose stamp
  # that project as owner and every other stack then warns about it. Already created, so
  # nothing to run; only needed on a fresh machine: docker network create mcp-net
  mcp-net:
    external: true
    name: mcp-net
